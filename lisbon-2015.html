<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lisbon 2015 · FRFC Tours</title><style>
:root{--ice:#92d7f7;--navy:#07131d;--paper:#f7f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:#07131df2;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff1a}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{width:38px;height:38px;object-fit:contain}
a{color:inherit}.back{text-decoration:none;color:var(--ice);font-weight:900;font-size:13px}
main{max-width:1250px;margin:auto;padding:48px 18px 80px}.eyebrow{color:var(--ice);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
h1{font-size:clamp(42px,8vw,82px);margin:8px 0 12px;letter-spacing:-.04em}.intro{color:#b8c5cc;max-width:700px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:30px}.grid a{display:block;min-height:180px;background:#102431;overflow:hidden}.grid img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;display:block;transition:.2s}.grid a:hover img{transform:scale(1.02)}
.empty{margin-top:30px;border:1px solid #ffffff22;padding:40px;color:#b8c5cc;background:#0d2230}
#lightbox{display:none;position:fixed;z-index:20;inset:0;background:#000e;align-items:center;justify-content:center;padding:20px}#lightbox.open{display:flex}#lightbox img{max-width:96vw;max-height:90vh;object-fit:contain}.close{position:absolute;right:20px;top:15px;font-size:38px;cursor:pointer}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:12px}.grid a{min-height:260px}}
</style></head>
<body><header><div class="brand"><img src="frfc-logo.png" alt="Fordingbridge RFC crest">FORDINGBRIDGE RFC</div><a class="back" href="index.html#archive">← POLAND 2027</a></header>
<main><div class="eyebrow">Fordingbridge RFC · Previous Tours</div><h1>Lisbon 2015</h1><p class="intro">Click any photograph to open it full screen. Click again, press Escape or use × to close.</p><div class="grid"><a href="lisbon-2015-01.jpeg" onclick="show(event,this.href)"><img src="lisbon-2015-01.jpeg" loading="lazy" alt="Lisbon 2015 photo"></a>
<a href="lisbon-2015-02.jpeg" onclick="show(event,this.href)"><img src="lisbon-2015-02.jpeg" loading="lazy" alt="Lisbon 2015 photo"></a>
<a href="lisbon-2015-03.jpg" onclick="show(event,this.href)"><img src="lisbon-2015-03.jpg" loading="lazy" alt="Lisbon 2015 photo"></a>
<a href="lisbon-2015-04.jpeg" onclick="show(event,this.href)"><img src="lisbon-2015-04.jpeg" loading="lazy" alt="Lisbon 2015 photo"></a></div></main>
<div id="lightbox" onclick="hide()"><span class="close">×</span><img id="big"></div>
<script>function show(e,u){e.preventDefault();document.getElementById('big').src=u;document.getElementById('lightbox').classList.add('open')}function hide(){document.getElementById('lightbox').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()})</script></body></html>
